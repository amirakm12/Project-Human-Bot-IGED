version: '3.8'

services:
  iged:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iged-main
    restart: unless-stopped
    ports:
      - "8080:8080"  # Admin panel
      - "9090:9090"  # Android client
      - "9091:9091"  # Metrics
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
      - ./config:/app/config
      - ./memory:/app/memory
      - iged-data:/app/data
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://iged:password@postgres:5432/iged
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - iged-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    container_name: iged-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=iged
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=iged
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iged-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iged"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iged-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - iged-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: iged-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - iged
    networks:
      - iged-network

  prometheus:
    image: prom/prometheus:latest
    container_name: iged-prometheus
    restart: unless-stopped
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - iged-network

  grafana:
    image: grafana/grafana:latest
    container_name: iged-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - iged-network

volumes:
  iged-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  iged-network:
    driver: bridge